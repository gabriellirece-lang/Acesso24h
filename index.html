<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abrindo acesso</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center, #21052e 0%, #0b010f 55%, #050007 100%);
    color: white;
}

.card {
    width: 92%;
    max-width: 740px;
    padding: 70px 50px 55px;
    text-align: center;
    border-radius: 70px;
    border: 2px solid rgba(190, 90, 255, 0.3);

    background:
        linear-gradient(
            135deg,
            rgba(76, 31, 98, 0.85),
            rgba(24, 7, 34, 0.95)
        );

    box-shadow:
        0 0 70px rgba(160, 50, 220, 0.15),
        inset 0 0 50px rgba(180, 70, 240, 0.05);
}

.lock {
    width: 175px;
    height: 175px;
    margin: 0 auto 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 48px;

    background: linear-gradient(
        145deg,
        #66229a,
        #281039
    );

    border: 2px solid rgba(210, 100, 255, 0.3);

    box-shadow:
        0 0 35px rgba(190, 60, 255, 0.2);

    font-size: 70px;
}

h1 {
    margin: 0 0 18px;
    font-size: 58px;
    font-weight: 800;
}

.subtitle {
    margin: 0 0 55px;
    color: #d4bfdc;
    font-size: 28px;
    font-weight: 600;
}

.progress {
    width: 100%;
    height: 24px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
}

.bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;

    background: linear-gradient(
        90deg,
        #b642ff,
        #d57cff
    );

    box-shadow: 0 0 20px rgba(205,76,255,0.8);

    animation: carregar 3s linear forwards;
}

.status {
    margin-top: 40px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 16px;

    color: #aa99b7;

    font-size: 23px;
    font-weight: 800;

    letter-spacing: 2px;
}

.dot {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #46d7a0;

    box-shadow: 0 0 18px #46d7a0;
}

@keyframes carregar {
    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .card {
        width: 90%;
        padding: 55px 28px 45px;
        border-radius: 48px;
    }

    .lock {
        width: 145px;
        height: 145px;
        font-size: 60px;
        border-radius: 40px;
    }

    h1 {
        font-size: 40px;
    }

    .subtitle {
        font-size: 21px;
        margin-bottom: 45px;
    }

    .progress {
        height: 20px;
    }

    .status {
        font-size: 16px;
        gap: 12px;
    }

    .dot {
        width: 14px;
        height: 14px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="lock">
        🔒
    </div>

    <h1>Abrindo acesso</h1>

    <p class="subtitle">
        Abrindo o Telegram...
    </p>

    <div class="progress">
        <div class="bar"></div>
    </div>

    <div class="status">
        <span class="dot"></span>
        <span>CONEXÃO SEGURA</span>
    </div>

</div>

<script>

setTimeout(function() {

    window.location.href =
        "https://t.me/+58V4Nz0MWZRlMDhh";

}, 3000);

</script>

</body>
</html>
